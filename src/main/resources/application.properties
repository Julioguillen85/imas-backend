# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=${PORT:8080}
spring.application.name=imas-agencia-backend

# ===================================================================
# CONEXIÓN A LA BASE DE DATOS (PostgreSQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/imas_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${DATABASE_USER:imas_user}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DATABASE_PASSWORD:Imasagencia}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# 'update' actualiza el esquema sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mapeo correcto para columnas JSONB de PostgreSQL
spring.jpa.properties.hibernate.type.preferred_json_type=jsonb

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT (Para la autenticación de Admin)
# ===================================================================
jwt.secret=${JWT_SECRET:IMAS_AGENCIA_ADUANAL_SECRET_KEY_SUPER_SECURE_2026_TOKEN}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================================================================
# CONFIGURACIÓN DE GROQ IA (Llama 3.3 70B Versatile)
# ===================================================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile

# ===================================================================
# CONFIGURACIÓN SMTP DE CORREO SALIENTE (IONOS -> info@imasagenciaaduanal.com)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.ionos.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:info@imasagenciaaduanal.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000